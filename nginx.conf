worker_processes auto;
events { worker_connections 1024; }

http {
  resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
  resolver_timeout 5s;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/wasm image/svg+xml;
  gzip_proxied any;
  gzip_min_length 1024;

  # WebSocket upgrade map
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ====================================================================
  # ПЕРЕМЕННЫЕ — ЗАМЕНИ НА СВОИ
  # ====================================================================
  # 1. LOVABLE_HOST — твой опубликованный сайт (без https://, без слеша)
  # 2. SUPABASE_HOST — твой Supabase (для этого проекта уже подставлено)
  # ====================================================================

  # === Upstream: опубликованный сайт Lovable ===
  # Замени на свой адрес после публикации, например: my-app.lovable.app
  # Точный адрес я скажу после нажатия Publish.
  upstream lovable_upstream {
    server  family-vacay-memories.lovable.app:443;
    keepalive 16;
  }

  # === Upstream: Supabase ===
  upstream supabase_upstream {
    server  lmgadycttcwrcydveqbk.supabase.co:443;
    keepalive 16;
  }

  server {
    listen 80 default_server;
    server_name _;

    # Большие загрузки фото/видео
    client_max_body_size 100m;

    # ================================================================
    # /supabase/* → Supabase (REST, Auth, Storage, Realtime)
    # ================================================================
    location /supabase/ {
      # Убираем префикс /supabase/ перед отправкой в апстрим
      rewrite ^/supabase/(.*)$ /$1 break;

      proxy_pass https://supabase_upstream;
      proxy_ssl_server_name on;
      proxy_ssl_name lmgadycttcwrcydveqbk.supabase.co;
      proxy_set_header Host lmgadycttcwrcydveqbk.supabase.co;

      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      # WebSocket для realtime
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Таймауты под загрузки и долгие WS-сессии
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
      proxy_connect_timeout 30s;

      proxy_buffering off;
      proxy_redirect off;
    }

    # ================================================================
    # / → опубликованный сайт Lovable
    # ================================================================
    location / {
      proxy_pass https://lovable_upstream;
      proxy_ssl_server_name on;
      proxy_ssl_name family-vacay-memories.lovable.app;
      proxy_set_header Host family-vacay-memories.lovable.app;

      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Accept-Encoding "";  # обязательно для sub_filter

      proxy_http_version 1.1;
      proxy_set_header Connection "";

      proxy_read_timeout  60s;
      proxy_send_timeout  60s;
      proxy_connect_timeout 30s;

      # Подмена URL Supabase в HTML/JS/JSON, отдаваемых сайтом,
      # чтобы браузер ходил в /supabase/, а не напрямую в supabase.co
      sub_filter_once off;
      sub_filter_types text/html text/css application/javascript application/json text/javascript;
      sub_filter 'https://lmgadycttcwrcydveqbk.supabase.co' '/supabase';
      sub_filter 'wss://lmgadycttcwrcydveqbk.supabase.co'   'wss://$host/supabase';

      # Не отдавать lovable-редиректы наружу
      proxy_redirect ~^https?://[^/]+/(.*)$ /$1;
    }

    # Health-check для Amvera
    location = /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }
  }
}
